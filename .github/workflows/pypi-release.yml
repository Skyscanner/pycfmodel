name: PyPI release

on:
  release:
    types: [published]

jobs:
  build:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pycfmodel
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false  # Disable cache for release builds to prevent cache poisoning

      - name: Setup python
        run: uv python install 3.10

      - name: Build package
        run: uv build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          # zizmor: ignore[use-trusted-publishing] https://github.com/pypi/warehouse/issues/17700
          user: __token__
          password: ${{ secrets.pypi_publish_token }}
