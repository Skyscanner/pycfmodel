name: PyPI release

on:
  release:
    types: [published]

jobs:
  build:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pycfmodel
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false  # Disable cache for release builds to prevent cache poisoning

      - name: Setup python
        run: uv python install 3.10

      - name: Build package
        run: uv build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # zizmor: ignore[use-trusted-publishing] https://github.com/pypi/warehouse/issues/17700
          user: __token__
          password: ${{ secrets.pypi_publish_token }}
